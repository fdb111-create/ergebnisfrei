name: Update highlights

on:
  schedule:
    - cron: "20 13-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch highlights and strip the scores
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_HANDLE: "@bundesliga"
          REGION: "GB"
          DAYS: "21"
        run: node tools/ingest.mjs

      - name: Save the new matchday
        run: |
          git config user.name "highlights bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Update highlights"
          git push
